<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sora Lab | 過去データ×直近トレンドの天気予測</title>
  <meta name="description" content="過去最大20年分の気象データと直近の気象トレンドを掛け合わせ、指定した場所・日付の晴天率と気温、服装の目安を予測するWebアプリです。" />
  <meta name="theme-color" content="#0b1026" />

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (Play CDN v3) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', '"Noto Sans JP"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen text-slate-100 antialiased">
  <!-- 背景の動くグラデーション -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-4">
    <div class="flex items-center gap-3">
      <div class="logo-badge">
        <i data-lucide="cloud-sun" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
          Sora<span class="text-gradient">Lab</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-400">過去の気象データ × 直近トレンドで「その日の空」を予測</p>
      </div>
    </div>
  </header>

  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 pb-16 grid gap-6 lg:grid-cols-[380px_1fr]">
    <!-- ===== 入力パネル ===== -->
    <section class="glass-card relative z-20 p-5 sm:p-6 h-fit lg:sticky lg:top-6 fade-in" aria-labelledby="form-title">
      <h2 id="form-title" class="text-lg font-bold flex items-center gap-2 mb-5">
        <i data-lucide="sliders-horizontal" class="w-5 h-5 text-sky-300"></i>予測条件
      </h2>

      <form id="predict-form" novalidate class="space-y-6">
        <!-- 場所 -->
        <div>
          <label for="location-input" class="field-label">
            <i data-lucide="map-pin" class="w-4 h-4"></i>場所
          </label>
          <div class="relative">
            <input id="location-input" type="text" autocomplete="off" placeholder="例：京都駅、富士山、箱根…"
              class="field-input pr-10" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="location-suggestions" />
            <span id="location-spinner" class="input-spinner hidden" aria-hidden="true"></span>
            <ul id="location-suggestions" class="suggest-list hidden" role="listbox"></ul>
          </div>
          <p id="location-selected" class="mt-2 text-xs text-emerald-300/90 hidden"></p>
          <div id="quick-tags" class="flex flex-wrap gap-2 mt-3" aria-label="クイックタグ"></div>
        </div>

        <!-- 日付 -->
        <div>
          <label class="field-label">
            <i data-lucide="calendar-days" class="w-4 h-4"></i>知りたい日付
          </label>
          <div id="date-picker-container"></div>
        </div>

        <!-- 集計期間 -->
        <div>
          <span class="field-label" id="period-label">
            <i data-lucide="history" class="w-4 h-4"></i>集計期間
          </span>
          <div id="period-segment" class="segment" role="radiogroup" aria-labelledby="period-label">
            <button type="button" id="period-5" class="segment-btn" role="radio" aria-checked="false" data-years="5">過去5年</button>
            <button type="button" id="period-10" class="segment-btn active" role="radio" aria-checked="true" data-years="10">過去10年</button>
            <button type="button" id="period-20" class="segment-btn" role="radio" aria-checked="false" data-years="20">過去20年</button>
            <span class="segment-indicator" aria-hidden="true"></span>
          </div>
        </div>

        <button id="predict-btn" type="submit" class="predict-btn">
          <span class="btn-label flex items-center justify-center gap-2">
            <i data-lucide="sparkles" class="w-5 h-5"></i>天気を予測する
          </span>
          <span class="btn-loading hidden items-center justify-center gap-2">
            <span class="spinner"></span>データを解析中…
          </span>
        </button>
      </form>

      <p class="mt-5 text-[11px] leading-relaxed text-slate-500">
        データ提供：<a class="underline hover:text-slate-300" href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> /
        <a class="underline hover:text-slate-300" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
      </p>
    </section>

    <!-- ===== 結果エリア ===== -->
    <section id="results" class="min-w-0 relative z-10" aria-live="polite">
      <!-- 初期表示 -->
      <div id="empty-state" class="glass-card p-8 sm:p-12 text-center fade-in">
        <div class="empty-icon mx-auto mb-6">
          <i data-lucide="cloud-sun-rain" class="w-14 h-14"></i>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold mb-3">場所と日付を選んで、空を予測しよう</h2>
        <p class="text-slate-400 text-sm sm:text-base max-w-lg mx-auto leading-relaxed">
          過去の同じ日の天気を集計した「晴天率」と、最近の気温の傾向を加味した「ハイブリッド気温予測」で、
          お出かけの日の服装や注意点までまとめてお届けします。
        </p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8 text-left">
          <div class="feature-pill"><i data-lucide="percent" class="w-5 h-5 text-amber-300"></i><span>過去N年の晴天率</span></div>
          <div class="feature-pill"><i data-lucide="trending-up" class="w-5 h-5 text-rose-300"></i><span>直近トレンド補正</span></div>
          <div class="feature-pill"><i data-lucide="shirt" class="w-5 h-5 text-sky-300"></i><span>服装＆注意点</span></div>
        </div>
      </div>

      <!-- ローディング（スケルトン） -->
      <div id="loading-state" class="hidden space-y-6">
        <div class="glass-card p-6"><div class="skeleton h-6 w-1/2 mb-3"></div><div class="skeleton h-4 w-1/3"></div></div>
        <div class="grid gap-6 md:grid-cols-2">
          <div class="glass-card p-6"><div class="skeleton h-40 w-full"></div></div>
          <div class="glass-card p-6"><div class="skeleton h-40 w-full"></div></div>
        </div>
        <div class="glass-card p-6"><div class="skeleton h-32 w-full"></div></div>
      </div>

      <!-- エラー -->
      <div id="error-state" class="hidden glass-card error-card p-6 fade-in" role="alert"></div>

      <!-- 結果本体 -->
      <div id="result-content" class="hidden space-y-6"></div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/weather-codes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
